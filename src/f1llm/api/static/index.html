<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>f1llm</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand">f1<span class="accent">llm</span></span>
    <span class="status" id="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-label">conectando…</span>
    </span>
  </header>

  <main class="thread" id="thread"></main>

  <form class="composer" id="composer">
    <input
      type="text"
      id="question"
      class="field"
      placeholder="Pergunte sobre uma sessão, piloto ou Grande Prêmio…"
      autocomplete="off"
    >
    <button type="submit" class="send" id="send" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="#111111"/>
      </svg>
    </button>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
