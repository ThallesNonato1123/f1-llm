[project]
name = "f1llm"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "ThallesNonato1123", email = "eusouthalles@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.8.0",
    "fastf1>=3.8.3",
]

[project.scripts]
f1llm-preview = "f1llm.preview:main"
f1llm-chat = "f1llm.llm.cli:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits real external services (FastF1 network/cache); excluded by default.",
]
addopts = "-m 'not integration'"
